<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ger Protocol — Field Guide</title>
  <style>
    :root {
      --bg: #121110;
      --card-bg: #1c1a18;
      --text: #e6e1da;
      --muted: #a09a90;
      --accent: #d99b43;
      --accent-hover: #c48937;
      --border: #2e2b27;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    header {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-inner {
      width: 16px;
      height: 16px;
      border: 1px dashed var(--accent);
      border-radius: 50%;
    }

    .titles h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .titles p {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .lang-switcher select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    main {
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .graphic-container {
      width: 120px;
      height: 120px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      position: relative;
    }

    .graphic-center {
      width: 40px;
      height: 40px;
      border: 1px solid var(--accent);
      border-radius: 50%;
    }

    h2 {
      font-family: Georgia, serif;
      font-size: 2.25rem;
      font-weight: normal;
      line-height: 1.2;
    }

    .description {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #121110;
      border: none;
      padding: 0.85rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .meta-info {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo"><div class="logo-inner"></div></div>
      <div class="titles">
        <h1 id="appTitle">The Ger Protocol</h1>
        <p id="appSubtitle">Official Field Protocol · Juulchin Travel</p>
      </div>
    </div>
    
    <div class="lang-switcher">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en" selected>EN</option>
        <option value="mn">MN</option>
        <option value="zh">ZH</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
        <option value="ru">RU</option>
      </select>
    </div>
  </header>

  <main>
    <div class="graphic-container">
      <div class="graphic-center"></div>
    </div>

    <h2 id="heroHeading">Before you step inside</h2>
    <p id="heroDesc" class="description">
      A 30-second field guide to the customs of a Mongolian ger — five simple rules, one respectful visit.
    </p>

    <button id="startBtn" class="btn-primary">Begin the walkthrough</button>
    <p id="metaText" class="meta-info">5 steps · about 30 seconds</p>
  </main>

  <script>
    const TRANSLATIONS = {
      en: {
        title: "The Ger Protocol",
        subtitle: "Official Field Protocol · Juulchin Travel",
        heading: "Before you step inside",
        desc: "A 30-second field guide to the customs of a Mongolian ger — five simple rules, one respectful visit.",
        button: "Begin the walkthrough",
        meta: "5 steps · about 30 seconds"
      },
      mn: {
        title: "Гэрийн Дэг Журам",
        subtitle: "Албан ёсны гарын авлага · Жуулчин Трэвел",
        heading: "Та гэрт орохоосоо өмнө",
        desc: "Монгол гэрийн ёс заншлын 30 секундын гарын авлага — таван энгийн дүрэм, нэг хүндэтгэлтэй зочлолт.",
        button: "Заавартай танилцах",
        meta: "5 алхам · ойролцоогоор 30 секунд"
      },
      zh: {
        title: "蒙古包礼仪指南",
        subtitle: "官方实用指南 · Juulchin Travel",
        heading: "进入蒙古包之前",
        desc: "30秒快速了解蒙古包传统习俗 — 五项简单规则，一次充满尊重拜访。",
        button: "开始了解",
        meta: "5个步骤 · 约需30秒"
      },
      ja: {
        title: "ゲル訪問マナーガイド",
        subtitle: "公式フィールドガイド · Juulchin Travel",
        heading: "ゲル（包）に入る前に",
        desc: "モンゴルのゲルでのマナーを学ぶ30秒のガイド — 5つの簡単なルールで敬意ある訪問を。",
        button: "ガイドを開始する",
        meta: "5つのステップ · 約30秒"
      },
      ko: {
        title: "게르 방문 에티켓 Guide",
        subtitle: "공식 현장 가이드 · Juulchin Travel",
        heading: "게르에 들어서기 전에",
        desc: "몽골 게르의 전통 예절을 배우는 30초 가이드 — 5가지 간단한 규칙, 존중하는 방문.",
        button: "가이드 시작하기",
        meta: "5단계 · 약 30초 소요"
      },
      ru: {
        title: "Протокол Посещения Юрты",
        subtitle: "Официальный гид · Juulchin Travel",
        heading: "Прежде чем войти в юрту",
        desc: "30-секундный гид по традициям монгольской юрты — пять простых правил для уважительного визита.",
        button: "Начать ознакомление",
        meta: "5 шагов · около 30 секунд"
      }
    };

    function changeLanguage(langKey) {
      const data = TRANSLATIONS[langKey] || TRANSLATIONS.en;
      document.getElementById('appTitle').innerText = data.title;
      document.getElementById('appSubtitle').innerText = data.subtitle;
      document.getElementById('heroHeading').innerText = data.heading;
      document.getElementById('heroDesc').innerText = data.desc;
      document.getElementById('startBtn').innerText = data.button;
      document.getElementById('metaText').innerText = data.meta;
      document.documentElement.lang = langKey;
    }
  </script>
</body>
</html>
